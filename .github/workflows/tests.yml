name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, intl
          coverage: none

      - name: Link PHP 8.4 to Ubuntu's own PCRE2
        # setup-php unpacks PHP together with a current libpcre2, as a file beside the one Ubuntu's package owns. Production PHP often links the older one its distribution ships, so this leg removes the newer file and loads Ubuntu's again.
        if: matrix.php == '8.4'
        run: |
          ldd "$(command -v php)" | grep pcre2
          ls -l /usr/lib/x86_64-linux-gnu/libpcre2-8.so.0*
          for file in /usr/lib/x86_64-linux-gnu/libpcre2-8.so.0.*; do
            dpkg --search "$file" > /dev/null 2>&1 || sudo rm --verbose "$file"
          done
          sudo apt-get install --yes --reinstall libpcre2-8-0
          sudo ldconfig
          ls -l /usr/lib/x86_64-linux-gnu/libpcre2-8.so.0*

      - name: Require PCRE2 older than 10.43 on PHP 8.4
        # Production PHP often links the system PCRE2; this leg keeps patterns that need 10.43+ (variable-length lookbehind) failing here first.
        if: matrix.php == '8.4'
        run: |
          php -r 'echo "PCRE ", PCRE_VERSION, PHP_EOL; exit(version_compare(strtok(PCRE_VERSION, " "), "10.43", "<") ? 0 : 1);'

      - name: Install dependencies
        run: composer update --prefer-dist --with-all-dependencies --no-interaction --no-scripts

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: vendor/bin/pest --compact
