name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, intl
          coverage: none

      - name: Require PCRE2 older than 10.43 on PHP 8.4
        # Production PHP often links the system PCRE2; this leg keeps patterns that need 10.43+ (variable-length lookbehind) failing here first.
        if: matrix.php == '8.4'
        run: |
          php -r 'echo "PCRE ", PCRE_VERSION, PHP_EOL; exit(version_compare(strtok(PCRE_VERSION, " "), "10.43", "<") ? 0 : 1);'

      - name: Install dependencies
        run: composer update --prefer-dist --with-all-dependencies --no-interaction --no-scripts

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: vendor/bin/pest --compact
